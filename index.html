<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="base-segments" content="0" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zenova — One agency for everything modern</title>
    <!-- Google Search harvests ONE favicon per hostname and resolves it from the
         site root, so this is an absolute /favicon.ico rather than %BASE_URL%
         (base is "/" in production — deploy.yml sets CUSTOM_DOMAIN=true).
         KEEP THIS URL STABLE: changing it resets Google's crawl (several days to
         several weeks). sizes="any" lets SVG-capable browsers prefer the vector
         below without hiding the .ico from Google or from browsers that ignore
         SVG icons. The .ico already embeds 16/32/48/64/128/256, and the manifest
         covers Android, so no per-size icon links are needed here. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/favicon/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%assets/favicon/apple-icon-180x180.png" />
    <link rel="manifest" href="%BASE_URL%assets/favicon/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zenova" />
    <meta name="application-name" content="Zenova" />
    <meta name="msapplication-TileColor" content="#faf8f5" />
    <meta name="msapplication-TileImage" content="%BASE_URL%assets/favicon/ms-icon-144x144.png" />
    <meta name="msapplication-config" content="%BASE_URL%assets/favicon/browserconfig.xml" />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="description" content="Zenova combines design, development, marketing, and startup support into one seamless partnership for ambitious modern businesses." />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://api.fontshare.com" />
    <link rel="dns-prefetch" href="https://cdn.fontshare.com" />
    <link rel="dns-prefetch" href="https://api.zenova.agency" />
    <link rel="dns-prefetch" href="https://ui-avatars.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://api.zenova.agency" crossorigin />
    <link rel="preconnect" href="https://ui-avatars.com" crossorigin />
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700&display=swap" as="style" />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" as="style" />
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,600,700&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      /* Matches --bg from :root[data-theme='light'] in global.css, so the paint
         before the app stylesheet loads is not a dark flash. */
      html, body { margin: 0; padding: 0; background: #faf8f5; }
    </style>

    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <script>
      document.documentElement.setAttribute('data-theme', 'light');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
