<!--
  Artwork for the "One team from brief to launch" post. The flow drawing is
  the site's 'flow' motif (components/ui/Motif.astro) enlarged 2x on the same
  white card + wash-4 tint family as the other post artwork. The final node
  and its dot — the launch — are the one brand-coloured accent.

  Rasterise to public/blog/one-team-brief-to-launch.png with
  scripts/blog-art.mjs — og:image needs a PNG; SVG is not supported by
  social scrapers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="1032" cy="139" r="560">
      <stop offset="0" stop-color="#6fb6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" gradientUnits="userSpaceOnUse" cx="1188" cy="491" r="380">
      <stop offset="0" stop-color="#ffaecb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffaecb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#base)"/>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#blush)"/>

  <rect x="140" y="100" width="920" height="430" rx="28" fill="#ffffff" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- 'flow' motif at 2x, terminal node promoted from ink to brand -->
  <g transform="translate(280 105) scale(2)" stroke="#0b3558" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="86" width="74" height="38" rx="10" opacity=".8"/>
    <rect x="126" y="24" width="74" height="38" rx="10" opacity=".62"/>
    <rect x="126" y="148" width="74" height="38" rx="10" opacity=".62"/>
    <rect x="234" y="86" width="70" height="38" rx="10" stroke="#006bff" opacity=".95"/>
    <path d="M90 105c22 0 14-62 36-62" opacity=".55"/>
    <path d="M90 105c22 0 14 62 36 62" opacity=".55"/>
    <path d="M200 43c22 0 12 62 34 62" opacity=".55"/>
    <path d="M200 167c22 0 12-62 34-62" opacity=".55"/>
    <circle cx="53" cy="105" r="4.5" fill="#0b3558" stroke="none" opacity=".9"/>
    <circle cx="163" cy="43" r="4.5" fill="#0b3558" stroke="none" opacity=".7"/>
    <circle cx="163" cy="167" r="4.5" fill="#0b3558" stroke="none" opacity=".7"/>
    <circle cx="269" cy="105" r="4.5" fill="#006bff" stroke="none"/>
  </g>
</svg>
