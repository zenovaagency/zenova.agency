<!--
  Artwork for the Core Web Vitals post. The chart drawing is the site's
  'chart' motif (components/ui/Motif.astro) enlarged 2x and set on the same
  white card + wash-4 tint family the blog index and post hero use, so the
  image reads as part of the page rather than a dropped-in stock graphic.
  The trend line and its endpoint are the one brand-coloured accent.

  Rasterise to public/blog/core-web-vitals.png with scripts/blog-art.mjs —
  og:image needs a PNG; SVG is not supported by social scrapers.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff5ff"/>
      <stop offset="1" stop-color="#f6f9ff"/>
    </linearGradient>
    <radialGradient id="sky" gradientUnits="userSpaceOnUse" cx="1032" cy="139" r="560">
      <stop offset="0" stop-color="#6fb6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#6fb6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" gradientUnits="userSpaceOnUse" cx="1188" cy="491" r="380">
      <stop offset="0" stop-color="#ffaecb" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffaecb" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#base)"/>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#blush)"/>

  <rect x="140" y="100" width="920" height="430" rx="28" fill="#ffffff" stroke="#e4e7eb" stroke-width="1.5"/>

  <!-- 'chart' motif at 2x, trend line promoted from ink to brand -->
  <g transform="translate(280 105) scale(2)" stroke="#0b3558" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 178h268" opacity=".5"/>
    <rect x="44" y="132" width="34" height="46" rx="5" fill="#0b3558" opacity=".26" stroke="none"/>
    <rect x="94" y="108" width="34" height="70" rx="5" fill="#0b3558" opacity=".34" stroke="none"/>
    <rect x="144" y="118" width="34" height="60" rx="5" fill="#0b3558" opacity=".3" stroke="none"/>
    <rect x="194" y="72" width="34" height="106" rx="5" fill="#0b3558" opacity=".44" stroke="none"/>
    <rect x="244" y="40" width="34" height="138" rx="5" fill="#0b3558" opacity=".58" stroke="none"/>
    <path d="M52 122 108 96l50 12 50-40 52-32" stroke="#006bff" opacity=".95"/>
    <circle cx="261" cy="36" r="5" fill="#006bff" stroke="none"/>
    <path d="M26 40h44" opacity=".35"/>
    <path d="M26 76h30" opacity=".28"/>
  </g>
</svg>
